    ok(/오늘 공부 시간\(본인 기기 측정\): \d\d:\d\d:\d\d/.test(q('#admin-body').textContent), '관리자 화면에 사용자별 오늘 공부 시간');
    const pc = q('#admin-body [data-act="att-photo"]');
    ok(pc && pc.dataset.label.startsWith('김'), '관리자 화면에 김의 출석 ✔');
    pc.click(); await wait(200);
    ok(q('#photoOv').classList.contains('on') && q('#photoImg').src.startsWith('data:'), '관리자는 출석 사진 열람');
    ok(!FAKE_DB.tables.attendance.some(r => r.id === 999) && !FAKE_DB.storage['attendance/u-2/2026-09-01-1.jpg'], '30일 지난 출석 사진·기록 자동 삭제');

    // ── 과목 팩: 사용자는 자기 과목만, 관리자는 과목 선택·사용자별 과목 지정 ──
    FAKE_DB.now = null;
    FAKE_DB.tables.profiles.push({ id: 'u-3', name: '최', role: 'member', created_at: '4', subjects: ['net'] });
    FAKE_DB.users.push({ id: 'u-3', email: 'choi@t.kr', pw: 'pw4' });
    FAKE_DB.session = { user: { id: 'u-3', email: 'choi@t.kr' } };
    await boot().catch(() => { }); await wait(300);
    let sv = null; try { sv = localStorage.getItem('swm-subj'); } catch (e) { }
    ok(sv === 'net', '네트워크 과목 사용자가 다른 과목 화면으로 열면 자기 과목으로 전환: ' + sv);
    W = await boot(); D = W.document; q = s => D.querySelector(s); qa = s => [...D.querySelectorAll(s)];
    ok(!q('#homeEss').hidden && q('#quote').hidden && q('#homeEss').textContent.length > 3, '네트워크 과목: 처음 화면에 오늘의 약술');
    ok(D.documentElement.dataset.subj === 'net' && q('#bankN').textContent === String(W.SWM_PACKS.net.probs.length) && q('[data-tab="memo"] span').textContent === '암기 카드' && q('#subjSel').hidden, '네트워크 과목 화면: 문제 수·메뉴 이름, 과목이 하나라 과목 선택 숨김');
    ok(!q('#p-home').textContent.includes('재무') && q('.home-title').textContent === 'MOMENTUM' && q('#menuSubj').textContent.includes('네트워크관리사'), '재무관리 문구가 보이지 않음');
    q('[data-tab="bank"]').click(); await wait(100);
    ok(['객관식', 'O/X', '암기 카드'].every(k => q('#f-kind').textContent.includes(k)), '문제은행 유형: 객관식·O/X·암기 카드');
    { const card = q('#bank-list .card'), opts = card.querySelectorAll('.qin.mc .opt');
      ok(opts.length === 4 && /^①/.test(opts[0].textContent), '객관식 보기 4개(①~④) 세로 배치');
      opts[0].click(); card.querySelector('[data-act="grade"]').click(); await wait(1000);   // 서버 저장은 0.7초 모아서
      const pid = card.id.replace('cd-b-', '');
      ok(/정답/.test(q('#' + card.id + ' .verdict').textContent) && FAKE_DB.tables.progress.some(r => r.user_id === 'u-3' && r.pid === pid), '객관식 채점 → 서버에 기록: ' + q('#' + card.id + ' .verdict').textContent.slice(0, 30)); }
    q('[data-tab="mock"]').click(); q('[data-act="mock-start"]').click(); await wait(200);
    ok(qa('#mock-list .card').length === 50 && !qa('#mock-list .card').some(c => /O\/X ·/.test(c.querySelector('.ctitle').textContent)), '모의고사 50문제 (O/X·암기 카드 제외): ' + qa('#mock-list .card').length + ' ' + qa('#mock-list .card').map(c => c.querySelector('.ctitle').textContent).filter(t => /O\/X/.test(t)).join('|'));
    { const cnt = {}; qa('#mock-list .card .tag.unit').forEach(t => cnt[t.textContent] = (cnt[t.textContent] || 0) + 1);
      ok(/^(60|59):/.test(q('#timer').textContent), '네트워크 모의고사 시간 60분: ' + q('#timer').textContent);
      ok(cnt['TCP/IP'] === 17 && cnt['네트워크 일반'] === 10 && cnt['NOS'] === 18 && cnt['네트워크 운용기기'] === 5, '모의고사 과목 배분 = 실제 시험(17·10·18·5): ' + JSON.stringify(cnt)); }
    q('[data-tab="memo"]').click(); await wait(100);
    ok(qa('#memo-list .mcard').length === W.SWM_PACKS.net.probs.filter(d => d.essay).length, '암기 카드 페이지');
    // 관리자: 모든 과목 선택 가능, 사용자별 과목 지정
    FAKE_DB.session = { user: { id: 'u-admin', email: 'admin@t.kr' } };
    W = await boot(); D = W.document; q = s => D.querySelector(s); qa = s => [...D.querySelectorAll(s)];
    ok(!q('#subjSel').hidden && qa('#subjSel option').length === 4 && q('#subjSel').value === 'net', '관리자는 과목 선택 목록(4과목: 정보처리기사 포함)');
    q('[data-tab="admin"]').click(); await wait(400);
    { const choi = qa('#admin-body .ucard').find(c => c.querySelector('h3').textContent.startsWith('최'));
      ok(choi && choi.querySelector('h3').textContent.includes('네트워크관리사') && choi.querySelector('.sj-u-3[value="net"]').checked && /1\/2\/3회독 1\//.test(choi.textContent), '관리자 화면: 최의 과목(네트워크)과 진도'); }
    D.querySelector('.sj-u-2[value="fm2"]').checked = false; D.querySelector('.sj-u-2[value="fm1"]').checked = true;
    q('[data-act="subj-save"][data-uid="u-2"]').click(); await wait(300);
    ok(JSON.stringify(FAKE_DB.tables.profiles.find(p => p.id === 'u-2').subjects) === '["fm1"]', '관리자가 이의 과목을 1차 재무관리로 지정');
    { const r = await new Promise(res => { FAKE_DB.session = { user: { id: 'u-1', email: 'kim@t.kr' } }; W.supabase.createClient().from('profiles').update({ subjects: ['net'] }).eq('id', 'u-1').then(res); }); ok(!!r.error, '일반 사용자는 자기 과목을 바꿀 수 없음'); }
    FAKE_DB.session = { user: { id: 'u-admin', email: 'admin@t.kr' } };
    try { localStorage.setItem('swm-subj', 'fm1'); } catch (e) { }
    W = await boot(); D = W.document; q = s => D.querySelector(s); qa = s => [...D.querySelectorAll(s)];
    ok(q('#homeEss').hidden && !q('#quote').hidden && q('#qText').textContent.length > 3, '약술형이 없는 1차 재무관리: 처음 화면은 명언 유지');
    ok(q('#homeDm').hidden && W.getComputedStyle(q('#homeDm')).display === 'none', '2차 재무관리가 아닌 과목: 일일 모의고사 숨김');
    q('[data-tab="bank"]').click(); await wait(100);
    { const opts = q('#bank-list .card .qin.mc').querySelectorAll('.opt');
      ok(D.documentElement.dataset.subj === 'fm1' && q('#bankN').textContent === String(W.SWM_PACKS.fm1.probs.length) && opts.length === 5 && q('[data-tab="memo"]').hidden, '1차 재무관리: 5지선다, 약술 메뉴 숨김'); }
    try { localStorage.removeItem('swm-subj'); } catch (e) { }
    // 새 기기: 이 기기 저장이 비어도 서버 읽음 위치로 시작 (앱을 다시 띄우므로 맨 끝에서)
    { const fnv = s => { let h = 0x811c9dc5; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193); } return h >>> 0; }, crK = r => fnv('u-1|' + r).toString(36);
      const room = 'dm:' + ['u-1', 'u-2'].sort().join(':');
      FAKE_DB.session = { user: { id: 'u-1', email: 'kim@t.kr' } };
      const r0 = { id: ++FAKE_DB.seq, room, sender: 'u-2', body: '새 기기 확인용', created_at: new Date().toISOString() }; FAKE_DB.tables.messages.push(r0);
      const row = () => FAKE_DB.tables.progress.find(r => r.user_id === 'u-1' && r.pid === 'chatread');
      const fresh = async () => { localStorage.removeItem('cpa-fm-chatread:u-1'); localStorage.removeItem('cpa-fm-v1:u-1'); W = await boot(); D = W.document; await wait(400); };
      row().data.r = {};
      await fresh();
      ok(q('#chatN').textContent !== '', '서버에 읽음 위치가 없으면 새 기기에서 안 읽음으로 표시: ' + q('#chatN').textContent);
      await wait(900);
      FAKE_DB.tables.messages.forEach(m => { row().data.r[crK(m.room)] = Math.max(+row().data.r[crK(m.room)] || 0, m.id); });
      row().data.u = Date.now() + 1e6;
      await fresh();
      ok(q('#chatN').textContent === '', '서버 읽음 위치가 있으면 새 기기에서도 안 읽음으로 안 뜸: ' + q('#chatN').textContent); }
  } catch (e) { log.push('ERROR ' + e.message + '\n' + e.stack); }
  document.getElementById('out').textContent = log.join('\n');
})();
