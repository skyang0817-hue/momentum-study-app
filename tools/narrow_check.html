<!doctype html>
<meta charset="utf-8">
<title>좁은 화면 줄바꿈 점검</title>
<pre id="out">running</pre>
<div id="host"></div>
<script>
// 휴대폰 폭에서 모든 과목·메뉴를 열어, 글자가 한두 자씩 세로로 쪼개지는 곳과 가로로 넘치는 곳을 찾는다
const wait = ms => new Promise(r => setTimeout(r, ms));
const out = [], seen = new Set();
function scan(W, where) {
  W.document.querySelectorAll('.card.fold').forEach(c => c.classList.remove('fold'));   // 접힌 문제 내용까지 점검
  const D = W.document, R = D.createRange(), walker = D.createTreeWalker(D.body, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    const t = n.textContent.trim(); if (t.length < 2) continue;
    const el = n.parentElement; if (!el || !el.offsetParent || el.closest('.chat-panel,#loginOv,script,style')) continue;
    R.selectNodeContents(n);
    const rects = [...R.getClientRects()].filter(r => r.width > 0);
    if (rects.length < 2) continue;
    if (el.closest('.cx-html,.ipe-e,.ipe-q,.ans.tx,.mans,.cx-memo') && !el.closest('td,th')) continue;   // 문단 속 굵은 글씨가 줄 끝에서 넘어가는 건 정상 줄바꿈
    const fs = parseFloat(W.getComputedStyle(el).fontSize), maxW = Math.max(...rects.map(r => r.width));
    if (maxW < fs * 2.6) { const k = where.split(' ')[0] + '|' + el.tagName + '.' + el.className + '|' + t.slice(0, 20); if (!seen.has(k)) { seen.add(k); out.push(`세로 쪼개짐 [${where}] <${el.tagName.toLowerCase()} class="${el.className}"> "${t.slice(0, 30)}" 줄 ${rects.length}개, 폭 ${maxW | 0}px`); } }
  }
  const vw = W.innerWidth;
  D.querySelectorAll('.panel.on *, .deck *').forEach(el => {
    if (!el.offsetParent) return;
    const r = el.getBoundingClientRect();
    const hiddenPage = el.closest('.pg') && (el.closest('.pg').id === 'p-menu') !== (D.documentElement.dataset.view === 'menu');
    if (r.right > vw + 1 && !hiddenPage && !el.closest('.deck-track > .pg:not(.x) ~ .x, .wrapx, pre.cli, table.dt') && !el.matches('.deck-track,.pg') && W.getComputedStyle(el).position !== 'fixed') {
      const k = 'over|' + where + '|' + el.tagName + '.' + el.className; if (!seen.has(k)) { seen.add(k); out.push(`가로 넘침 [${where}] <${el.tagName.toLowerCase()} class="${el.className}"> 오른쪽 끝 ${r.right | 0}px > 화면 ${vw}px`); }
    }
  });
  if (D.documentElement.scrollWidth > vw + 1) out.push(`페이지 가로 스크롤 [${where}] ${D.documentElement.scrollWidth} > ${vw}`);
}
// 학습 메뉴를 끝까지 내렸을 때 맨 아래 타일(AI 출제 등)이 아래에 떠 있는 타이머·메신저 버튼에 가리지 않는지
const covered = async (W, D, where) => {
  // 로그인한 실제 화면처럼: 메신저 버튼 + 공부 시간 현황(5명) + 그 위로 올라간 타이머
  const fab = D.querySelector('#chatFab'), adm = D.querySelector('#stAdm'), st = D.querySelector('#stimer');
  if (fab) fab.hidden = false;
  if (adm) { adm.hidden = false; adm.innerHTML = '<button class="sa-h"><b>공부 시간 현황</b><small>2명 측정 중</small><span>▾</span></button><div class="sa-l">' + [1, 2, 3, 4, 5].map(i => `<div class="sa-r run"><span class="sa-n">사용자${i}</span><b>01:00:00</b><small>측정 중</small></div>`).join('') + '</div>'; const pin = D.createElement('style'); pin.textContent = `#stAdm{display:block!important} #stimer{bottom:${(adm.style.display = 'block', adm.offsetHeight) + 26}px!important}`; D.head.appendChild(pin); }   // 로컬 모드에서는 앱이 1초마다 현황을 숨기므로 스타일로 고정
  await wait(1300);   // 앱이 1초마다 아래 여백(--dock)을 다시 계산
  W.scrollTo(0, D.documentElement.scrollHeight); await wait(200);
  const tiles = [...D.querySelectorAll('#p-menu nav.tabs button')].filter(b => !b.hidden && b.offsetParent);
  const fixed = ['#stimer', '#stAdm', '#chatFab'].map(x => D.querySelector(x)).filter(el => el && !el.hidden && W.getComputedStyle(el).display !== 'none').map(el => el.getBoundingClientRect());
  const hit = tiles.filter(b => { const r = b.getBoundingClientRect(); return fixed.some(f => r.left < f.right && r.right > f.left && r.top < f.bottom && r.bottom > f.top); });
  if (hit.length) out.push(`가림 [${where}] ${hit.map(b => b.textContent.trim()).join(', ')}`);
  W.scrollTo(0, 0);
};
async function run() {
  for (const width of [360, 390]) for (const s of ['fm2', 'fm1', 'net', 'ipe']) {
    const f = document.createElement('iframe'); f.style.cssText = `width:${width}px;height:800px;border:0`;
    const ld = new Promise(r => f.onload = r); f.src = '/index.html?local&subj=' + s; document.getElementById('host').replaceChildren(f); await ld; await wait(1200);
    const W = f.contentWindow, D = W.document, q = x => D.querySelector(x), qa = x => [...D.querySelectorAll(x)];
    { const st = D.createElement('style'); st.textContent = '*{transition:none!important}'; D.head.appendChild(st); }   // 헤드리스에서는 넘김 애니메이션이 진행되지 않으므로 끈다
    const tag = t => `${t} ${s} ${width}px`;
    scan(W, tag('home'));
    q('[data-act="pg"][data-pg="1"]').click(); await wait(1200); scan(W, tag('menu'));
    await covered(W, D, tag('menu'));
    for (const tab of ['bank', 'sum', 'memo', 'cx', 'journal', 'att', 'mock', 'dm', 'aiw', 'aif', 'plan']) {
      const b = q(`[data-tab="${tab}"]`); if (!b || b.hidden) continue;
      b.click(); await wait(300);
      if (tab === 'aiw' || tab === 'aif') { qa('#p-' + tab + ' [data-act="showsol"]').forEach(x => x.click()); await wait(200); }
      if (tab === 'bank') { qa('#bank-list [data-act="showsol"]').forEach(x => x.click()); await wait(200); }
      if (tab === 'memo') { const o = q('[data-act="memo-openall"]'); if (o) o.click(); await wait(200); }
      if (tab === 'mock') { q('[data-act="mock-start"]').click(); await wait(300); }
      if (tab === 'cx') {
        for (const word of W.SWM_PACKS[s].concepts.map(c => c.name.replace(/\(.*\)/, '')).slice(0, 60)) { q('#cx-q').value = word; q('#cx-form').requestSubmit(); await wait(30); qa('.cx-memo').forEach(d => d.open = true); scan(W, tag('cx:' + word)); }
        continue;
      }
      scan(W, tag(tab));
    }
  }
  for (const [w, h] of [[1024, 768], [1100, 700], [1280, 720], [1366, 768], [1920, 1080]]) for (const s of ['fm2', 'ipe']) {   // PC 크기: 가림만 확인
    const f = document.createElement('iframe'); f.style.cssText = `width:${w}px;height:${h}px;border:0`;
    const ld = new Promise(r => f.onload = r); f.src = '/index.html?local&subj=' + s; document.getElementById('host').replaceChildren(f); await ld; await wait(1200);
    const W = f.contentWindow, D = W.document; { const st = D.createElement('style'); st.textContent = '*{transition:none!important}'; D.head.appendChild(st); }
    D.querySelector('[data-act="pg"][data-pg="1"]').click(); await wait(800); await covered(W, D, `menu ${s} ${w}x${h}`);
  }
  document.getElementById('out').textContent = (out.length ? out.join('\n') : '문제 없음') + '\nDONE';
}
run().catch(e => document.getElementById('out').textContent = 'ERROR ' + e.message + '\n' + e.stack + '\nDONE');
</script>
