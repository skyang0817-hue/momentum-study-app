        all().click(); await wait(30); ok(!q('#pat-list'), '한 번 더 누르면 접힘');
        bad().click(); await wait(30); q(`#pat-list .pat-li[data-id="${p1}"]`).click(); await wait(200);
        ok(q('#p-bank').classList.contains('on') && q('#cd-b-' + p1) && !q('#cd-b-' + p1).classList.contains('fold') && Math.abs(q('#cd-b-' + p1).getBoundingClientRect().top - 70) < 40, '목록에서 누르면 문제은행의 그 문제가 펼쳐져 화면 위로 ' + JSON.stringify({ on: q('#p-bank').classList.contains('on'), has: !!q('#cd-b-' + p1), fold: q('#cd-b-' + p1) && q('#cd-b-' + p1).classList.contains('fold'), top: q('#cd-b-' + p1) && Math.round(q('#cd-b-' + p1).getBoundingClientRect().top), y: Math.round(W.scrollY), max: D.documentElement.scrollHeight - W.innerHeight }));
        q('[data-tab="plan"]').click(); await wait(100);
        const aiP = Object.keys(LS()).find(pid => /^ai-/.test(pid) && (LS()[pid].hist || []).length);
        if (aiP) { all().click(); await wait(30); q(`#pat-list .pat-li[data-id="${aiP}"]`).click(); await wait(250);
          ok(q('#p-aiw').classList.contains('on') && q('#cd-aw-' + aiP) && !q('#cd-aw-' + aiP).classList.contains('fold'), 'AI 출제 문제는 약점 맞춤 문제에서 펼쳐 보여 줌'); }
        q('[data-tab="plan"]').click(); await wait(100); ok(!q('#pat-list'), '다시 열면 목록은 접힌 상태'); }
      { const cb = q('#pat-box [data-act="pat-cx"]'); if (cb) { cb.click(); await wait(100); ok(q('#p-cx').classList.contains('on') && q('#cx-q').value.length > 0, '개념 버튼 → 개념 찾기로 이동'); } }
    }
  } catch (e) { log.push('ERROR ' + e.message + ' ' + e.stack); }
  document.getElementById('out').textContent = log.join('\n');
};
</script>
