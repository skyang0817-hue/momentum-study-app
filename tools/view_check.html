<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>if(!/^(127\.0\.0\.1|localhost)$/.test(location.hostname)){document.documentElement.innerHTML='<p style="font:16px sans-serif;padding:20px">테스트 페이지는 개발 PC(localhost)에서만 실행됩니다.</p>';throw new Error('test page blocked');}</script>
<title>화면 점검 (관리자·사용자 × PC·휴대폰)</title>
<style>html,body{margin:0;padding:0;overflow:hidden}iframe{border:0;display:block;width:100vw;height:100vh}</style>
<div id="host"></div>
<script>
// 가짜 Supabase로 사용자(김)·관리자 로그인 화면을 이 창 크기 그대로 띄운다. 바깥 스크립트(CDP)가 window.step(이름)을 차례로 부르고 캡처.
// 데이터: 김의 문제별 풀이 기록(오답 이유·자동 감지 포함), 일일 모의고사, 공부 타이머
try { localStorage.removeItem('swm-subj'); } catch (e) { }
const wait = ms => new Promise(r => setTimeout(r, ms));
const T = new Date(), day = n => { const d = new Date(T.getTime() - n * 864e5); return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul' }).format(d); };
const H = (n, sc, mx, i, w, a) => Object.assign({ d: day(n), sc, mx, v: 1, m: 0, i, t: T.getTime() - n * 864e5 }, w ? { w, wt: 1 } : {}, a ? { a } : {});
const row = (pid, hist, extra) => ({ user_id: 'u-1', pid, data: Object.assign({ n: hist.length, box: 1, due: day(-1), ok: hist.filter(h => h.sc === h.mx).length, last: hist[hist.length - 1].d, hist, u: 1 }, extra || {}) });
window.FAKE_DB = {
  seq: 100, session: null, calls: [],
  users: [{ id: 'u-admin', email: 'admin@t.kr', pw: 'pw1' }, { id: 'u-1', email: 'kim@t.kr', pw: 'pw2' }],
  tables: {
    profiles: [{ id: 'u-admin', name: '관리자', role: 'admin', created_at: '1' }, { id: 'u-1', name: '김민준', role: 'member', created_at: '2' }],
    progress: [
      row('cb-replace', [H(12, 5, 5, 'a1'), H(6, 5, 5, 'a2')]), row('cb-payback', [H(11, 4, 4, 'a3'), H(4, 4, 4, 'a4')]), row('cb-mirr', [H(9, 3, 3, 'a5')]),
      row('pf-apt-three', [H(10, 2, 4, 'b1', ['formula']), H(5, 3, 4, 'b2', ['formula', 'concept'])], { note: 'APT 요인 민감도와 요인 위험프리미엄 순서를 헷갈림\n→ 식부터 적고 숫자 넣기', noteAt: T.getTime() - 5 * 864e5 }),
      row('pf-cml-sml-eff', [H(8, 3, 5, 'b3', ['formula'], ['round'])]), row('pf-capm-alpha-arb', [H(2, 4, 4, 'b4')]),
      row('bd-credit', [H(9, 2, 3, 'c1', null, ['unit']), H(3, 2, 3, 'c2', null, ['unit'])]), row('bd-replicate-arb', [H(7, 1, 3, 'c3', ['calc'], ['unit'])]), row('bd-immun-convex', [H(1, 2, 3, 'c4')]),
      row('dv-swap', [H(6, 4, 4, 'd1')]), row('dv-parity-strategy', [H(5, 2, 3, 'd2', ['read'], ['sign'])]), row('dv-binomial', [H(2, 6, 6, 'd3')]),
      row('cf-rights', [H(4, 3, 3, 'e1')]), row('cf-agency', [H(3, 1, 2, 'e2', null, ['tover'])]), row('cf-mm', [H(1, 2, 3, 'e3', ['calc'])]),
    ],
    mock_results: [], assignments: [{ id: 1, user_id: 'u-1', unit: 'bd', note: '듀레이션 보강', active: true, created_at: '1' }],
  },
};
async function boot(user) {
  FAKE_DB.session = user ? { user } : null;
  const html = (await (await fetch('../index.html')).text())
    .replace('<head>', '<head><base href="../">')
    .replace(/<script src="config\.js[^"]*"><\/script>/, '<script>window.FM_CONFIG={supabaseUrl:"https://fake.supabase.co",supabaseAnonKey:"x",pushKey:"BEDPUFb7Qi_gcdwbrIP16DJP93UGwLEnVb4v2GIw-tYROE8nEFD77SDLfbhBG5mP-35KdPgAI-3bKOzg6NgdeTQ"}<\/script><script src="tools/fake_sb.js"><\/script><script src="tools/fake_push.js"><\/script>');
  const f = document.createElement('iframe');
  const loaded = new Promise(r => f.addEventListener('load', r, { once: true }));
  f.srcdoc = html; document.getElementById('host').replaceChildren(f); await loaded;
  for (let i = 0; i < 60 && !(f.contentDocument && f.contentDocument.querySelector('#savebadge') && f.contentWindow.FM_PROBLEMS); i++) await wait(100);
  await wait(1200);
  return f.contentWindow;
}
let W, D;
const q = s => D.querySelector(s), qa = s => [...D.querySelectorAll(s)];
const home = async () => { for (let i = 0; i < 6 && D.documentElement.dataset.view !== 'home'; i++) { const b = q('[data-act="back"]'); if (!b) break; b.click(); await wait(600); } };
const tab = async t => { await home(); const m = q('[data-act="pg"][data-pg="1"]'); if (m && !['journal', 'att', 'dm'].includes(t)) { m.click(); await wait(600); } q(`[data-act="tab"][data-tab="${t}"]`).click(); await wait(400); };
const toTop = () => W.scrollTo(0, 0);
const to = (sel, off = 70) => { const el = q(sel); if (!el) return false; W.scrollTo(0, el.getBoundingClientRect().top + W.scrollY - off); return true; };
// 화면 점검: 가로 넘침·화면 밖으로 나간 요소·잘린 글자·작은 터치 영역
function audit() {
  const vw = D.documentElement.clientWidth, out = [], clip = [], small = [];
  const scrollable = el => { for (let p = el.parentElement; p; p = p.parentElement) { const s = W.getComputedStyle(p); if (/(auto|scroll|hidden)/.test(s.overflowX) && p.scrollWidth > p.clientWidth + 1) return true; } return false; };
  const vis = el => { const r = el.getBoundingClientRect(), s = W.getComputedStyle(el); return r.width > 0 && r.height > 0 && s.visibility !== 'hidden' && s.display !== 'none' && !el.closest('[hidden],.fold .card-body,details:not([open]) > :not(summary)'); };
  const name = el => (el.id ? '#' + el.id : el.tagName.toLowerCase() + (el.className && typeof el.className === 'string' ? '.' + el.className.trim().split(/\s+/).slice(0, 2).join('.') : '')) + ' "' + (el.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 24) + '"';
  qa('.panel.on *, .pg.on *, header *, .topbar *').forEach(el => {
    if (!vis(el)) return; const r = el.getBoundingClientRect();
    if ((r.right > vw + 1 || r.left < -1) && !scrollable(el) && !['svg', 'path', 'line', 'text', 'g', 'rect', 'circle', 'polyline'].includes(el.tagName.toLowerCase())) out.push(name(el) + ` [${Math.round(r.left)}~${Math.round(r.right)}]`);
    const s = W.getComputedStyle(el);
    if (/^(BUTTON|A|SPAN|B|LABEL)$/.test(el.tagName) && el.scrollWidth > el.clientWidth + 2 && /(hidden|clip)/.test(s.overflowX) && s.textOverflow !== 'ellipsis') clip.push(name(el));
  });
  if (vw < 600) qa('.panel.on button, .panel.on .chip').forEach(b => { if (!vis(b)) return; const r = b.getBoundingClientRect(); if (r.height < 28 || r.width < 28) small.push(name(b) + ` ${Math.round(r.width)}x${Math.round(r.height)}`); });
  return { overflowX: D.documentElement.scrollWidth - vw, out: [...new Set(out)].slice(0, 8), clip: [...new Set(clip)].slice(0, 8), small: [...new Set(small)].slice(0, 8), badge: (q('#savebadge') || {}).textContent };
}
// 화면 내용 요약(PC·휴대폰 비교용): 보이는 제목·버튼 글자
function sig(sel) { const box = q(sel) || D.body; return [...box.querySelectorAll('h2,h3,.mg-h,.pat-f,.pat-st,.wt-h,button,.tag')].filter(el => el.getBoundingClientRect().width > 0 && !el.closest('.fold .card-body')).map(el => el.textContent.trim().replace(/\s+/g, ' ').slice(0, 40)).filter(Boolean); }
let bankKey = null;
const STEPS = {
  async member() { W = await boot({ id: 'u-1', email: 'kim@t.kr' }); D = W.document; W.confirm = () => true; return { who: q('#who') && q('#who').textContent, login: !q('#loginOv').classList.contains('on') }; },
  async admin() { W = await boot({ id: 'u-admin', email: 'admin@t.kr' }); D = W.document; W.confirm = () => true; return { who: q('#who') && q('#who').textContent, login: !q('#loginOv').classList.contains('on') }; },
  async home() { await home(); toTop(); await wait(200); return { a: audit(), sig: sig('.pg.on, main') }; },
  async menu() { await home(); q('[data-act="pg"][data-pg="1"]').click(); await wait(700); toTop(); return { a: audit(), sig: sig('#p-menu, .pg.on') }; },
  async card() {   // 문제은행: 한 문제를 부호 반대로 틀리고 이유를 고른 화면
    await tab('bank');
    const ks = qa('#bank-list .card').map(c => c.id.slice(3)).filter(k => { const C = W.FM_CARDS[k], d = C && W.SWM_PACKS.fm2.byId[C.pid]; return C && d && d.qs[0].type === 'num' && C.pid.startsWith('dv-'); });
    bankKey = ks.find(k => !W.FM_CARDS[k].recorded) || ks[0]; const C = W.FM_CARDS[bankKey], x = W.SWM_PACKS.fm2.byId[C.pid].qs[0].ans(C.inst.c, C.inst.p);
    q('#cd-' + bankKey + ' .card-head').click(); await wait(100);
    const el = q('#cd-' + bankKey + ' input.my1[data-qi="0"]'); el.value = String(-x); el.dispatchEvent(new W.Event('input', { bubbles: true }));
    q('#cd-' + bankKey + ' [data-act="grade"]').click(); await wait(100);
    const t = q('#wt-' + bankKey + ' [data-r="read"]'); if (t) t.click(); await wait(50);
    to('#v-' + bankKey, 140); await wait(200);
    return { a: audit(), sig: sig('#cd-' + bankKey), wt: !!q('#wt-' + bankKey + ' [data-act="wt"]') };
  },
  async cardPast() {   // 예전에 틀린 문제를 다시 열었을 때: 지난 풀이에 이유 고르기
    await tab('bank'); const k = 'b-pf-apt-three', el = q('#cd-' + k); if (!el) return { error: 'no card' };
    if (el.classList.contains('fold')) { el.querySelector('.card-head').click(); await wait(100); }
    to('#wt-' + k, 160); await wait(200);
    return { a: audit(), wt: !!q('#wt-' + k + ' [data-act="wt"]'), pressed: qa('#wt-' + k + ' [aria-pressed="true"]').map(b => b.textContent), head: (q('#wt-' + k + ' .wt-h') || {}).textContent };
  },
  async pat() { await tab('plan'); toTop(); await wait(200); return { a: audit(), sig: sig('#p-plan'), flags: qa('.pat-f').map(x => x.textContent.trim().replace(/\s+/g, ' ').slice(0, 70)) }; },
  async patTodo() { to('#pat-box .pat-todo, #pat-box .pat-mxw'); const m = q('#pat-box .pat-mxw'); if (m) m.open = true; await wait(200); to('#pat-box .pat-mxw'); await wait(150); return { a: audit() }; },
  async patRank() { await tab('plan'); toTop(); const r = q('#pat-box .pat-rk'); if (r) { r.parentElement.scrollIntoView({ block: 'start' }); W.scrollBy(0, -70); } await wait(200); return { a: audit(), n: qa('.pat-rk').length, qs: qa('.pat-rk .pq').length }; },
  async patList() { await tab('plan'); toTop(); q('[data-act="pat-list"][data-k="bad"]').click(); await wait(200); return { a: audit(), n: qa('#pat-list .pat-li').length }; },
  async patGo() { const li = q('#pat-list .pat-li'), id = li.dataset.id; li.click(); await wait(500); const c = q('#cd-b-' + id) || q('#cd-aw-' + id); return { a: audit(), id, open: !!c && !c.classList.contains('fold'), top: c && Math.round(c.getBoundingClientRect().top) }; },
  async dm() { await tab('dm'); toTop(); await wait(200); return { a: audit(), sig: sig('#p-dm') }; },
  async adminPanel() { await tab('admin'); await wait(800); toTop(); return { a: audit(), demoLink: !!q('#admin-body a[href^="?demo"]'), dma: !!q('#adm-dm table, #adm-dm .dma') }; },
  async adminUser() { const c = qa('#admin-body .ucard').find(x => x.textContent.includes('김민준')); if (c) { c.scrollIntoView({ block: 'start' }); W.scrollBy(0, -70); } await wait(200); const p = c && c.querySelector('.pat-adm'); if (p) { p.scrollIntoView({ block: 'center' }); } await wait(150); return { a: audit(), pat: p ? p.textContent.trim().replace(/\s+/g, ' ') : null }; },
  async patAdmin() { await tab('plan'); toTop(); await wait(200); return { a: audit(), sig: sig('#p-plan'), demoLink: !!q('#pat-box a[href^="?demo"]') }; },
};
window.step = async name => { try { return await STEPS[name](); } catch (e) { return { error: e.message, stack: String(e.stack).slice(0, 400) }; } };
window.ready = true;
</script>
