<!doctype html>
<meta charset="utf-8">
<title>보안 헤더(CSP) 점검</title>
<pre id="out">running</pre>
<iframe id="f" style="width:420px;height:700px"></iframe>
<script>
// _headers의 CSP를 붙여 주는 서버에서 실행: 서버 모드 첫 화면 → 로그인 시도(Supabase 연결 허용 확인) → 글꼴(SRI) 적용 확인
const wait = ms => new Promise(r => setTimeout(r, ms)), log = [], ok = (c, m) => log.push((c ? 'PASS ' : 'FAIL ') + m);
(async () => {
  const f = document.getElementById('f'), ld = new Promise(r => f.onload = r);
  f.src = '/index.html'; await ld; await wait(2500);
  const W = f.contentWindow, D = W.document, q = s => D.querySelector(s);
  ok(!!W.supabase && typeof W.supabase.createClient === 'function', '앱에 포함한 supabase-js가 CSP 아래에서 실행됨');
  ok(q('#loginOv').classList.contains('on'), '로그인 창 표시');
  q('#lgEmail').value = 'csp-check@example.invalid'; q('#lgPw').value = 'wrong-password'; q('#loginForm').requestSubmit();
  for (let i = 0; i < 40 && !q('#lgErr').textContent; i++) await wait(250);
  ok(/로그인 실패/.test(q('#lgErr').textContent) && !/Failed to fetch|NetworkError/i.test(q('#lgErr').textContent), 'Supabase 로그인 서버 연결 허용 (응답: ' + q('#lgErr').textContent + ')');
  await D.fonts.ready;
  const sheet = k => [...D.styleSheets].find(x => x.href && x.href.includes(k)), rules = x => { try { return x.cssRules.length; } catch (e) { return -1; } };
  const pre = sheet('pretendard'), gf = sheet('fonts.googleapis');
  ok(pre && rules(pre) > 0 && [...D.fonts].some(f => /Pretendard/.test(f.family)), 'Pretendard 글꼴 CSS 적용(SRI 무결성 통과) — 규칙 ' + (pre ? rules(pre) : 0) + '개');
  ok(gf && [...D.fonts].some(f => /Nanum Pen Script/.test(f.family)), '명언 필기체(구글 글꼴) CSS 적용');
  document.getElementById('out').textContent = log.join('\n') + '\nDONE';
})().catch(e => document.getElementById('out').textContent = 'ERROR ' + e.message + '\nDONE');
</script>
